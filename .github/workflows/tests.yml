name: Offline reproducibility tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    name: unit-tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Free unused SDK disk space for historical 8 GiB reserve checks
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before removing unused GitHub-hosted SDKs:"
          df -h .
          # GitHub ubuntu-latest contains large SDKs unused by this Python-only suite.
          # Keep the existing 8 GiB reserve guards intact; never skip tests.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          echo "Disk after cleanup:"
          df -h .
          python - <<'PY'
          import shutil
          from pathlib import Path
          free = shutil.disk_usage(Path.cwd()).free
          print(f"Available disk after runner cleanup: {free / 2**30:.2f} GiB")
          # Extra headroom avoids flaky checks inside temporary test fixtures.
          if free < 12 * 2**30:
              raise SystemExit("Insufficient CI disk space: >=12 GiB required before suite")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            research/requirements-ci.txt
            research/requirements-pe-contract.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r research/requirements-ci.txt
      - name: Record installed versions
        run: |
          mkdir -p test-results
          python -m pip freeze > test-results/dependencies.txt
      - name: Compile all research scripts
        run: python -m compileall -q scripts tests
      - name: Test all offline research controls without skips
        run: python scripts/run_offline_tests.py --fail-on-skip --report test-results/offline.json
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-tests-python-${{ matrix.python }}
          path: test-results/
          if-no-files-found: error

  # Preserve existing check names while running the suite only in unit-tests.
  # always() plus an explicit assertion propagates failures instead of skipping.
  python-tests:
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the complete suite and compilation
        env:
          FULL_SUITE_RESULT: ${{ needs.unit-tests.result }}
        run: test "$FULL_SUITE_RESULT" = success

  pe-contract:
    name: pe-contract (${{ matrix.python }})
    needs: unit-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Require paired-end controls covered by the complete suite
        env:
          FULL_SUITE_RESULT: ${{ needs.unit-tests.result }}
        run: test "$FULL_SUITE_RESULT" = success
