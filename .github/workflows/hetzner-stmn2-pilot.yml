name: Hetzner fixed STMN2 technical pilot
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: hetzner-disposable-smoke
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the fixed single-library replay
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_ELA_PILOT_TOKEN }}
        run: |
          test -n "$HCLOUD_TOKEN"
          python infrastructure/hetzner/stmn2_pilot.py "ela-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pilot-evidence
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: stmn2-single-library-pilot
          path: pilot-evidence/
          if-no-files-found: warn
          retention-days: 7
  verify-cleanup:
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently verify deletion
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNER_ELA_PILOT_TOKEN }}
        run: |
          test -n "$HCLOUD_TOKEN"
          python infrastructure/hetzner/smoke.py cleanup --name "ela-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
