name: Iso-Seq mapping checks
on:
  push:
    paths:
      - 'scripts/map_isoseq_gtf.py'
      - 'tests/test_map_isoseq_gtf.py'
      - 'research/references/target_gene_ids_gencode_v47.json'
      - '.github/workflows/isoseq-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test transcript mapping
        run: python -m unittest discover -s tests -p 'test_map_isoseq_gtf.py' -v
