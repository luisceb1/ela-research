name: UNC13A analysis tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/unc13a-tests.yml'
  push:
    branches:
      - 'research/2026-10-30-independent-splicing-gate'
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/unc13a-tests.yml'
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pyarrow
      - name: Compile all research scripts
        run: python -m compileall -q scripts tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
