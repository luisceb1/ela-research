name: PRJDB19918 supplement schema gate
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/prjdb19918-supplement-schema.yml'
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public article and one junction supplement header
        run: |
          python3 - <<'PY'
          import hashlib, io, json, re, urllib.request, urllib.parse, zipfile
          import xml.etree.ElementTree as ET
          def fetch(url, cap):
              req = urllib.request.Request(url, headers={"User-Agent":"ELA-research/schema-intake"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = response.read(cap+1)
              if len(data)>cap:
                  raise ValueError("response exceeds cap")
              return data
          def receipt(data):
              return {"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          xlink="{http://www.w3.org/1999/xlink}href"
          try:
              xml=fetch("https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12267460/fullTextXML", 2*1024*1024)
              doc=ET.fromstring(xml)
              print("ARTICLE_RECEIPT "+json.dumps(receipt(xml)))
              candidates=[]
              for item in doc.iter("supplementary-material"):
                  label=" ".join(" ".join(t.itertext()) for t in item.findall("caption"))
                  label+=" "+" ".join(" ".join(t.itertext()) for t in item.findall("label"))
                  hrefs=[q.attrib[xlink] for q in item.iter() if xlink in q.attrib]
                  print("SUPPLEMENT_CATALOG "+json.dumps({"label":label[:250],"hrefs":hrefs}))
                  if re.search(r"Supplementary Data\s*1\b",label,re.I):
                      candidates.extend(hrefs)
              names=[h for h in candidates if re.fullmatch(r"[A-Za-z0-9_.-]+\.(xlsx|csv|tsv)",h,re.I)]
              if len(set(names))!=1:
                  raise ValueError("no unique supported Data 1 filename")
              name=names[0]
              url="https://pmc.ncbi.nlm.nih.gov/articles/instance/12267460/bin/"+urllib.parse.quote(name)
              data=fetch(url,4*1024*1024)
              print("SUPPLEMENT_RECEIPT "+json.dumps({"name":name,**receipt(data)}))
              if name.lower().endswith(".xlsx"):
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      members=z.namelist()
                      ns="{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
                      def bounded(n,cap=2*1024*1024):
                          if z.getinfo(n).file_size>cap:
                              raise ValueError("member exceeds cap")
                          return z.read(n)
                      ss=[]
                      if "xl/sharedStrings.xml" in members:
                          strings=ET.fromstring(bounded("xl/sharedStrings.xml"))
                          ss=["".join(t.text or "" for t in si.iter(ns+"t")) for si in strings.iter(ns+"si")]
                      sheets=[n for n in members if re.fullmatch(r"xl/worksheets/sheet\d+\.xml",n)]
                      print("SHEET_COUNT "+str(len(sheets)))
                      for sheet in sheets[:12]:
                          with z.open(sheet) as f:
                              for event,row in ET.iterparse(f,events=("end",)):
                                  if row.tag!=ns+"row":
                                      continue
                                  header=[]
                                  for c in row.findall(ns+"c"):
                                      v=c.findtext(ns+"v","")
                                      if c.get("t")=="s" and v.isdigit():
                                          v=ss[int(v)]
                                      elif c.get("t")=="inlineStr":
                                          v="".join(t.text or "" for t in c.iter(ns+"t"))
                                      else:
                                          v="[non-string]"
                                      header.append(v[:160])
                                  print("SCHEMA_HEADER "+json.dumps({"sheet":sheet,"columns":header[:80]}))
                                  break
              else:
                  import csv
                  reader=csv.reader(io.StringIO(data.decode("utf-8-sig")),delimiter="\t" if name.lower().endswith(".tsv") else ",")
                  print("SCHEMA_HEADER "+json.dumps({"columns":[v[:160] for v in next(reader)[:80]]}))
          except Exception as exc:
              print("SCHEMA_PENDING "+type(exc).__name__+": "+str(exc)[:200])
          PY
