name: Fratta Dox R check (bounded)
on:
  pull_request:
    paths:
      - 'scripts/check_fratta_dox_join.R'
      - '.github/workflows/fratta-dox-r-check.yml'
permissions:
  contents: read
jobs:
  r-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install dplyr from a fixed repository snapshot
        run: timeout 240 Rscript -e 'install.packages("dplyr", repos="https://packagemanager.posit.co/cran/__linux__/noble/2025-06-01", Ncpus=2)'
      - name: Fetch only the pinned molecular CSV
        env:
          FRATTA_CSV: ${{ runner.temp }}/Protein_RNA_Corr_3.csv
        run: |
          python - <<'PY'
          import os,urllib.request,hashlib
          from pathlib import Path
          url='https://raw.githubusercontent.com/frattalab/unc13a_cryptic_splicing/e05e8723e3d18e64c6c559db18de423282511c91/data/Protein_RNA_Corr_3.csv'
          with urllib.request.urlopen(url,timeout=20) as response:
              data=response.read(16385)
          assert len(data)<=16384
          assert hashlib.sha256(data).hexdigest()=='c7de1f2d44f9a5ac243e0ef380f50c455254c1cbefc6a217dc091505918526e5'
          Path(os.environ['FRATTA_CSV']).write_bytes(data)
          PY
      - name: Execute the original join and key-preserving comparator in R
        run: Rscript scripts/check_fratta_dox_join.R "${{ runner.temp }}/Protein_RNA_Corr_3.csv" "${{ runner.temp }}/fratta-r-check"
      - uses: actions/upload-artifact@v4
        with:
          name: fratta-dox-r-check
          path: ${{ runner.temp }}/fratta-r-check
          retention-days: 7
