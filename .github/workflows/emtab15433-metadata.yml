name: E-MTAB-15433 bounded metadata intake
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/emtab15433-metadata.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve official study and technical SDRF only
        run: |
          python3 - <<'PY'
          import csv, hashlib, io, json, re, urllib.request
          accession="E-MTAB-15433"
          root="https://www.ebi.ac.uk/biostudies/"
          def fetch(url,cap=1048576):
              req=urllib.request.Request(url,headers={"User-Agent":"ELA-research/metadata-intake"})
              with urllib.request.urlopen(req,timeout=20) as r: d=r.read(cap+1)
              if len(d)>cap: raise ValueError("response cap")
              return d
          def receipt(d): return {"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest()}
          def collect_files(obj,out):
              if isinstance(obj,dict):
                  if isinstance(obj.get("path"),str):
                      out.append({"path":obj["path"],"size":obj.get("size"),"type":obj.get("type")})
                  for v in obj.values():collect_files(v,out)
              elif isinstance(obj,list):
                  for v in obj:collect_files(v,out)
          try:
              d=fetch(root+"api/v1/studies/"+accession)
              x=json.loads(d);files=[];collect_files(x,files)
              print("STUDY_RECEIPT "+json.dumps(receipt(d)))
              print("FILE_CATALOG "+json.dumps(files[:100]))
          except Exception as e: print("STUDY_PENDING "+type(e).__name__)
          for url in (root+"files/"+accession+"/"+accession+".sdrf.txt",
                      "https://ftp.ebi.ac.uk/biostudies/fire/E-MTAB-/433/"+accession+"/Files/"+accession+".sdrf.txt"):
              try:
                  d=fetch(url)
                  reader=csv.DictReader(io.StringIO(d.decode("utf-8-sig")),delimiter="\t")
                  fields=reader.fieldnames or []
                  if not any("Source Name" in f for f in fields):raise ValueError("unexpected SDRF schema")
                  keep=[f for f in fields if re.search(r"^Source Name$|^Assay Name$|^Sample Name$|^Extract Name$|cell line|cell type|organism|replicate|differentiation|batch|culture condition|factor value|ENA_RUN|RUN ACCESSION|FASTQ_URI|FASTQ_MD5",f,re.I) and not re.search(r"genotype|donor|patient|clinical|sex|age",f,re.I)]
                  rows=list(reader)
                  if len(rows)>200:raise ValueError("row cap")
                  print("SDRF_RECEIPT "+json.dumps({"url":url,"rows":len(rows),"columns":fields,**receipt(d)}))
                  for row in rows:print("SDRF_ROW "+json.dumps({k:row.get(k) for k in keep},ensure_ascii=True))
                  break
              except Exception as e:print("SDRF_PENDING "+type(e).__name__)
          PY
