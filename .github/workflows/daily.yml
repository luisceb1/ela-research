name: ELA source watch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: write
concurrency:
  group: ela-source-watch
  cancel-in-progress: false
jobs:
  public-source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Create output directories
        run: mkdir -p reports state
      - name: PubMed records via Europe PMC
        id: pubmed
        continue-on-error: true
        run: python scripts/pubmed_watch.py
      - name: GEO structural inventory
        id: geo
        continue-on-error: true
        run: python scripts/geo_inventory.py
      - name: Version outputs
        if: always()
        run: |
          git config user.name "ela-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ state/
          if ! git diff --cached --quiet; then
            git commit -m "Automated public sources audit"
            git push
          fi
      - name: Mark source failures (do not silently accept)
        if: steps.pubmed.outcome == 'failure' || steps.geo.outcome == 'failure'
        run: |
          echo "At least one external source failed; inspect logs and reports."
          exit 1
