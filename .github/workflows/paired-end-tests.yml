name: Paired-end parser contract
on:
  pull_request:
    paths:
      - 'scripts/run_offline_tests.py'
      - 'tests/test_offline_test_runner.py'
      - 'scripts/pe_fragment_contract.py'
      - 'tests/test_pe_fragment_contract.py'
      - 'scripts/compact_pe_pipeline.py'
      - 'scripts/compact_ledger_phase.py'
      - 'scripts/pilot_execution_policy.py'
      - 'scripts/pilot_dry_runner.py'
      - 'scripts/unc13a_locus_audit_v2.py'
      - 'tests/test_unc13a_locus_audit_v2.py'
      - 'scripts/unc13a_locus_audit.py'
      - 'scripts/unc13a_locus_pipeline.py'
      - 'tests/test_unc13a_locus_audit.py'
      - 'scripts/offline_control_pilot.py'
      - 'tests/test_offline_control_pilot.py'
      - 'scripts/recover_ctrl_r2_clock.py'
      - 'tests/test_recover_ctrl_r2_clock.py'
      - 'scripts/recover_ctrl_r2_resume.py'
      - 'tests/test_recover_ctrl_r2_resume.py'
      - 'scripts/recover_ctrl_r2_final.py'
      - 'tests/test_recover_ctrl_r2_final.py'
      - 'scripts/recover_ctrl_r2_ipv4.py'
      - 'tests/test_recover_ctrl_r2_ipv4.py'
      - 'scripts/recover_ctrl_r2.py'
      - 'tests/test_recover_ctrl_r2.py'
      - 'scripts/recovered_read_pilot.py'
      - 'tests/test_recovered_read_pilot.py'
      - 'scripts/recover_ctrl_read.py'
      - 'tests/test_recover_ctrl_read.py'
      - 'scripts/cached_index_pilot.py'
      - 'tests/test_cached_index_pilot.py'
      - 'scripts/prepare_verified_index.py'
      - 'tests/test_prepare_verified_index.py'
      - 'scripts/recover_index_range.py'
      - 'tests/test_recover_index_range.py'
      - 'scripts/inspect_interrupted_pilot.py'
      - 'scripts/bounded_http_transport.py'
      - 'tests/test_block_http_reservation.py'
      - 'tests/test_inspect_interrupted_pilot.py'
      - 'scripts/real_pilot_workflow.py'
      - 'scripts/plan_b4_execution_policy.py'
      - 'tests/test_real_pilot_workflow.py'
      - 'tests/test_process_supervisor_v2.py'
      - 'scripts/sealed_local_workflow.py'
      - 'scripts/workflow_seal.py'
      - 'scripts/synthetic_sam_producer.py'
      - 'tests/test_sealed_local_workflow.py'
      - 'scripts/external_local_stage.py'
      - 'scripts/process_supervisor_v2.py'
      - 'tests/test_b4_ledger_policy.py'
      - 'tests/test_compact_pe_pipeline.py'
      - 'reports/unc13a-minigenome-20261102/fixtures/*.sam'
      - 'research/requirements-pe-contract.txt'
      - '.github/workflows/paired-end-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r research/requirements-pe-contract.txt
      - name: Run paired-end controls without skips
        run: >-
          python scripts/run_offline_tests.py --fail-on-skip
          --report test-results/paired-end.json
          test_pe_fragment_contract.py
          test_compact_pe_pipeline.py
          test_b4_ledger_policy.py
          test_sealed_local_workflow.py
          test_real_pilot_workflow.py
          test_process_supervisor_v2.py
          test_block_http_reservation.py
          test_inspect_interrupted_pilot.py
          test_recover_index_range.py
          test_prepare_verified_index.py
          test_cached_index_pilot.py
          test_recover_ctrl_read.py
          test_recovered_read_pilot.py
          test_recover_ctrl_r2.py
          test_recover_ctrl_r2_ipv4.py
          test_recover_ctrl_r2_final.py
          test_recover_ctrl_r2_resume.py
          test_recover_ctrl_r2_clock.py
          test_offline_control_pilot.py
          test_unc13a_locus_audit.py
          test_unc13a_locus_audit_v2.py
      - name: Store test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-end-tests-python-${{ matrix.python }}
          path: test-results/
          if-no-files-found: error
